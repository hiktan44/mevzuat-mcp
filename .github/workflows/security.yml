name: Security firewall

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  application-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.6"
          enable-cache: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Unit and firewall tests
        run: uv run python -m unittest discover -s tests -v
      - name: Static syntax checks
        run: |
          uv run python -m compileall -q .
          node --check web/app.js
      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build container
        run: docker build -t ticaret-mcp:security-check .
      - name: Assert non-root runtime
        run: test "$(docker image inspect ticaret-mcp:security-check --format '{{.Config.User}}')" = "appuser"
      - name: Scan container vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ticaret-mcp:security-check
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
